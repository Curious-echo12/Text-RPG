# =============================================
# 文字江湖 - 应用配置模板
# 复制此文件为 application.yml 并填入真实值
# =============================================

server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/text_rpg?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: your_db_username        # ← 数据库用户名
    password: your_db_password        # ← 数据库密码
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    host: smtp.qq.com                 # ← SMTP 服务器（QQ邮箱用 smtp.qq.com）
    port: 465
    username: your_email@qq.com       # ← 发件邮箱
    password: your_smtp_auth_code     # ← SMTP 授权码（非邮箱密码）
    properties:
      mail:
        smtp:
          auth: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465
          ssl:
            enable: true

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: your_jwt_secret_key_at_least_32_chars_long  # ← JWT 密钥（至少32字符）
  expiration: 86400000                                  # Token 有效期（毫秒）
